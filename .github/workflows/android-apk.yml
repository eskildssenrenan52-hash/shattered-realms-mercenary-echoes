name: Android APK (offline)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar o APK debug em um GitHub Release público
        type: boolean
        required: true
        default: false
      multiplayer_ws_url:
        description: Endpoint completo wss://servidor/ws; vazio mantém o transporte P2P legado
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar plataforma e build-tools Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo 'ANDROID_HOME/ANDROID_SDK_ROOT não está definido no runner.' >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager não encontrado sob $SDK_ROOT/cmdline-tools." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar pnpm e dependências
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Testes e tipos
        run: |
          pnpm test
          pnpm run test:server
          pnpm exec tsc --noEmit

      - name: Empacotar o jogo offline e compilar APK
        env:
          VITE_MULTIPLAYER_WS_URL: ${{ inputs.multiplayer_ws_url }}
        run: |
          pnpm run apk:package
          gradle -p android --no-daemon assembleDebug

      - name: Disponibilizar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-echoes-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK no GitHub Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: Shattered Realms — APK Android (build ${{ github.run_number }})
          body: |
            APK de teste compilado automaticamente a partir do commit `${{ github.sha }}`.

            O modo solo inclui assets locais e não exige Manus nem app companion. Este APK debug serve para teste; para lojas use assinatura release própria. O transporte dedicado só é ativado quando `multiplayer_ws_url` foi informado; sem ele, permanece o modo PeerJS/WebRTC legado. Ambos os modos online exigem internet.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
